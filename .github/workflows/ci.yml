name: Local workbench verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,telemetry]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/verify_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            .work/wheel-validation.json
  studio:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e ".[dev]"
      - run: .venv/bin/python scripts/export_schema.py
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-acceptance
          path: |
            docs/assets/*.png
            docs/assets/*performance.json
            web/test-results/
