[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-driven-ai-flow"
version = "0.2.0"
description = "Visual flow-based programming with explicit contracts, reviewed AI changes, and runtime probes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["contract-driven-development", "ai-coding", "flow-based-programming", "visual-programming", "software-architecture", "runtime-observability", "dataflow"]
dependencies = [
    "typer>=0.24",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25",
    "pyyaml>=6.0",
    "jsonschema>=4",
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "libcst>=1.5,<2",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.13,<3",
    "build>=1.2",
]
ai = [
    "openai>=1.0",
    "anthropic>=0.20",
]
telemetry = ["opentelemetry-sdk>=1.27"]
research = ["numpy>=1.26", "pandas>=2.1"]
tables = ["pyarrow>=15"]

[project.scripts]
sfa = "contract_driven_ai_flow.compat:main"
cdaf = "contract_driven_ai_flow.cli:app"

[project.gui-scripts]
cdaf-studio = "contract_driven_ai_flow.launcher:main"

[project.urls]
Repository = "https://github.com/iyohesohoka646-dotcom/SFA"
Issues = "https://github.com/iyohesohoka646-dotcom/SFA/issues"

[tool.setuptools.package-data]
contract_driven_ai_flow = ["static/**/*", "static/*", "templates/**/*", "schemas/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
