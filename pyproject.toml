[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfa"
version = "0.1.0"
description = "Semantic Flow Architecture: structure-centric, AI-as-executor programming paradigm"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.24",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25",
    "pyyaml>=6.0",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
ai = [
    "openai>=1.0",
    "anthropic>=0.20",
]

[project.scripts]
sfa = "sfa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
