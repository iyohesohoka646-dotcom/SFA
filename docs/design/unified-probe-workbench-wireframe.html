function probeList(){return state.probes.filter(p=>p.target===state.selected).map(p=>`<div class="probe-item"><input type="checkbox" ${p.enabled?'checked':''} data-probe-enable="${p.id}" aria-label="启用 ${p.name}"><span class="probe-kind">${icon(probeSymbol(p.kind))}</span><span class="name">${p.name}</span><span class="mini-state ${probeState(p)==='失败'?'bad':p.enabled?'good':'muted'}">${probeState(p)}</span><button data-open-probe="${p.id}" title="打开 ${p.name}" aria-label="打开 ${p.name}">${icon('chevron')}</button></div>`).join('')||'<div class="inline-empty">此对象尚无探针。</div>'}
function renderInspector(){$$('[data-inspect]').forEach(b=>b.classList.toggle('active',b.dataset.inspect===state.inspect));const v=current(),head=`<div class="inspect-title"><span class="target">${v.name}</span><span class="muted" style="font-size:11px">${v.shape} · ${v.type}</span></div>`;if(state.inspect==='ai'){$('#inspect-content').innerHTML=head+`<div class="task-fields"><div class="field"><label>任务</label><select aria-label="智能任务"><option>解释运算</option><option>建议探针</option><option>生成代码候选</option><option>Skill 审读</option></select></div><div class="field"><label>模型</label><button class="outlined" data-action="settings" style="font-size:11px">未配置 · 打开设置</button></div><div class="field"><label>输入预算</label><input aria-label="智能输入预算" type="number" value="4096"></div><div class="field"><label>最大步骤</label><input aria-label="智能最大步骤" type="number" value="4"></div><label class="small-label" for="intent">意图</label><textarea id="intent" placeholder="例如：将此步骤改为标准化"></textarea><button class="primary wide-action" disabled title="原型未连接模型服务">生成候选</button><button class="wide-action" data-action="context">${icon('ai')}查看上下文</button><div class="property-section">选中证据</div><div class="evidence-chip">${icon('file')}analysis.py · ${v.line}</div><div class="evidence-chip">${icon('grid')}${v.name} · 示例 v${versionOf()}</div><div class="evidence-chip">${icon('check')}探针结果</div></div>`;return}const properties=`<dl class="prop-list"><div class="prop-row"><dt>来源</dt><dd><button data-action="source">analysis.py:${v.line}</button></dd></div><div class="prop-row"><dt>数据版本</dt><dd class="mono">示例 v${v.name==='Z'?state.version:1}</dd></div><div class="prop-row"><dt>定义</dt><dd class="mono" title="${esc(v.definition)}">${esc(v.definition)}</dd></div><div class="prop-row"><dt>采集</dt><dd>精确示例</dd></div></dl><div class="property-section">显示<button class="help" data-help="color" title="显示选项帮助">${icon('help')}</button></div><div class="field"><label for="show-values">单元数值</label><input type="checkbox" id function renderBottom(){$$('[data-bottom]').forEach(b=>b.classList.toggle('active',b.dataset.bottom===state.bottom));$('#results-count').textContent=state.probes.length;$('#tree-probe-count').textContent=state.probes.length;$('#problem-count').textContent=state.version===2?'1':'0';if(state.bottom==='results'||state.bottom==='problems'){const probes=state.probes.filter(p=>state.bottom!=='problems'||probeState(p)==='失败');$('#bottom-content').innerHTML=`<table class="results-table"><thead><tr><th>探针</th><th>目标</th><th>状态</th><th>结果</th><th>数据版本</th></tr></thead><tbody>${probes.map(p=>{const status=probeState(p);return`<tr data-result="${p.id}"><td>${p.name}</td><td class="mono">${p.target}</td><td><span class="state ${status==='失败'?'fail':''}">${icon(status==='失败'?'error':p.enabled?'check':'ai')}${status}</span></td><td>${status==='失败'?'<code>NaN · [1, 2]</code>':p.kind==='view'?'示例产物':p.kind==='interpret'?'未调用模型':'示例检查'}</td><td class="mono">示例 v${p.target==='Z'?state.version:1}</td></tr>`}).join('')}</tbody></table>`}else if(state.bottom==='jobs'){$('#bottom-content').innerHTML='<table class="results-table"><thead><tr><th>任务</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>当前交互稿</td><td>未提交执行任务</td><td>—</td></tr></tbody></table>'}else{$('#bottom-content').innerHTML='<div class="console"><span class="muted">终端预留区域 · 原型未连接 shell</span><br>cdaf observe analysis.py<br>cdaf studio</div>'}}
function renderComparison(){const isData=['heatmap','table'].includes(state.tabs.find(t=>t.id===state.active)?.kind),visible=state.compare.enabled&&isData;$('#comparison-group').hidden=!visible;$('#probe-divider').hidden=!visible;if(!visible)return;const c=state.compare;$('#comparison-title').textContent=c.target;$('#comparison-version').value=c.version;$('#comparison-content').innerHTML=c.kind==='table'?renderTable(c.target,c.version):renderMatrix(c.target,c.version);$('#comparison-meta').textContent=`示例 v${c.target==='Z'?c.version:1}`;$$('[data-compare-kind]').forEach(b=>b.classList.toggle('active',b.dataset.compareKind===c.kind))}
function renderAll(){renderVariables();renderSource();renderTabs();renderDocument();renderComparison();renderInspector();renderBottom();$('#status-object').textContent=`${state.selected} · v${state.selected==='Z'?state.version:1}`;$('#run-select').value=state.version}
function toggleFocus(force){state.focus=force??!state.focus;app.classList.toggle('focus-mode',state.focus);renderTabs()}
function togglePanel(name){const cls='hide-'+name;app.classList.toggle(cls);if(name==='inspector')app.classList.toggle('show-inspector',!app.classList.contains(cls));if(name==='explorer')app.classList.toggle('show-explorer',!app.classList.contains(cls))}
function closeTab(id){state.tabs=state.tabs.filter(t=>t.id!==id);if(!state.tabs.length)state.tabs.push({id:'graph',kind:'graph'});if(state.active===id)state.active=state.tabs[0].id;const target=state.tabs.find(t=>t.id===state.active)?.target;if(target)state.selected=target;renderAll()}
function renderProbeOptions(){const choices={view:[['矩阵热图','heatmap','grid','内置'],['原始值','table','table','内置']],check:[['非有限值检查','finite','check','本地程序']],interpret:[['Skill 审读','skill','ai','流程'],['AI 解读','model','ai','模型 API'],['人工审读','manual','check','人工']]}[state.probeCategory];$('#probe-options').innerHTML=choices.map(([name,method,i,provider])=>`<button class="probe-option" data-add-method="${method}" data-add-name="${name}">${icon(i)}${name}<span class="provider">${provider}</span></button>`).join('')}
function addProbe(){state.probeCategory='view';$('#probe-target').value=state.selected;$$('[data-category]').forEach(b=>b.classList.toggle('active',b.dataset.category==='view'));renderProbeOptions();$('#probe-dialog').showModal()}
const commands=[['打开总体图','graph',''],['添加探针','add-probe',''],['显示／收起源码','toggle-source',''],['最大化／恢复文档','focus','Esc'],['显示／收起项目栏','sidebar','Ctrl B'],['显示／收起结果与终端','bottom','Ctrl J'],['打开公开工具库','tools',''],['模型设置','settings',''],['查看上下文','context','']];

function openCommand(){$('#command-search').value='';renderCommands();$('#palette').showModal();$('#command-search').focus()}
const actions={compare:()=>{state.compare.enabled=!state.compare.enabled;if(state.compare.enabled){Object.assign(state.compare,{target:state.selected,version:versionOf(),kind:'table'});if(innerWidth<=760)notify('窄窗口使用标签切换探针')}renderAll()},source:()=>{app.dataset.sourceHidden='no';app.dataset.graphSource='yes';app.classList.remove('hide-source');if(innerWidth<=760)app.classList.add('show-source');renderSource()},'hide-source':()=>{app.dataset.sourceHidden='yes';app.classList.add('hide-source');app.classList.remove('show-source')},'toggle-source':()=>{if(innerWidth<=760){app.classList.toggle('show-source');return}const hidden=app.classList.contains('hide-source');app.dataset.sourceHidden=hidden?'no':'yes';app.classList.toggle('hide-source',!hidden)},sidebar:()=>togglePanel('explorer'),inspector:()=>togglePanel('inspector'),bottom:()=>togglePanel('bottom'),focus:()=>toggleFocus(),graph:()=>showDocument('graph'),tools:()=>showDocument('tools'),context:()=>showDocument('context'),settings:()=>showDocument('settings'),'run-config':()=>{$('#run-menu').hidden=true;showDocument('runconfig')},'run-options':e=>{const menu=$('#run-menu');menu.hidden=!menu.hidden;if(!menu.hidden){const b=e?.target?.closest('[data-action="run-options"]')||$('.run-split [data-action="run-options"]'),r=b.getBoundingClientRect();menu.style.left=Math.min(Math.max(r.left,8),innerWidth-253)+'px'}},'open-command':openCommand,'add-probe':addProbe,'probe-inspect':()=>{state.inspect='probes';app.classList.remove('hide-inspector');app.classList.add('show-inspector');renderInspector()},'ai-inspect':()=>{state.inspect='ai';app.classList.remove('hide-inspector');app.classList.add('show-inspector');renderInspector()},help:()=>{$('#help').hidden=!$('#help').hidden}};
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){$('#'+close.dataset.close).close();return}const closeTabEl=e.target.closest('[data-close-tab]');if(closeTabEl){closeTab(closeTabEl.dataset.closeTab);return}const command=e.target.closest('[data-command]');if(command){$('#palette').close();actions[command.dataset.command]?.();return}const variable=e.target.closest('[data-variable]');if(variable){selectVariable(variable.dataset.variable);return}const tab=e.target.closest('[data-tab]');if(tab){state.active=tab.dataset.tab;const t=state.tabs.find(x=>x.id===state.active);if(t?.target)state.selected=t.target;app.classList.remove('show-source');renderAll();return}const act=e.target.closest('[data-action]');if(act){actions[act.dataset.action]?.(e);return}const doc=e.target.closest('[data-document]');if(doc){showDocument(doc.dataset.document);return}const inspect=e.target.closest('[data-inspect]');if(inspect){state.inspect=inspect.dataset.inspect;renderInspector();return}const bottom=e.target.closest('[data-bottom]');if(bottom){state.bottom=bottom.dataset.bottom;app.classList.remove('hide-bottom');renderBottom();return}const activity=e.target.closest('[data-activity]');if(activity){$$('[data-activity]').forEach(b=>b.classList.toggle('active',b===activity));const which=activity.dataset.activity;if(which==='tools')showDocument('tools');if(which==='ai')actions['ai-inspect']();if(which==='runs'){state.bottom='jobs';app.classList.remove('hide-bottom');renderBottom()}if(which==='probes')actions['probe-inspect']();if(which==='project'){app.classList.remove('hide-explorer');app.classList.add('show-explorer')}return}const comparison=e.target.closest('[data-compare-kind]');if(comparison){state.compare.kind=comparison.dataset.compareKind;renderComparison();return}const cell=e.target.closest('[data-cell]');if(cell){state.cell=cell.dataset.cell.split(',').map(Number);renderDocument();renderComparison();return}const line=e.target.closest('[data-line]');if(line){const n=Number(line.dataset.line);const name=n===3?'X':n===4?'mu':n>=8?'frame':'Z';selectVariable(name);return}const category=e.target.closest('[data-category]');if(category){state.probeCategory=category.dataset.category;$$('[data-category]').forEach(b=>b.classList.toggle('active',b===category));renderProbeOptions();return}const add=e.target.closest('[data-add-method]');if(add){const target=$('#probe-target').value,p={id:Date.now(),name:add.dataset.addName,kind:state.probeCategory,method:add.dataset.addMethod,target,enabled:state.probeCategory!=='interpret'};state.probes.push(p);$('#probe-dialog').close();state.selected=target;state.inspect='probes';if(p.kind==='view')showDocument(p.method,target);else{state.bottom='results';renderAll()}notify(`已添加 ${p.name} · ${target}`);return}const open=e.target.closest('[data-open-probe]');if(open){const p=state.probes.find(p=>p.id===Number(open.dataset.openProbe));if(p.kind==='view')showDocument(p.method,p.target);else if(p.kind==='interpret'){state.selected=p.target;actions['ai-inspect']()}else{state.selected=p.target;state.bottom='problems';app.classList.remove('hide-bottom');showDocument('heatmap',p.target)}return}const result=e.target.closest('[data-result]');if(result){const p=state.probes.find(p=>p.id===Number(result.dataset.result));state.selected=p.target;state.cell=p.kind==='check'?[1,2]:[0,0];if(p.kind==='view')showDocument(p.method,p.target);else if(p.kind==='check')showDocument('heatmap',p.target);else actions['ai-inspect']();return}const run=e.target.closest('[data-run-mode]');if(run){state.mode=run.dataset.runMode;$('#run-label').textContent=state.mode;$$('[data-run-mode]').forEach(b=>b.classList.toggle('selected',b===run));$('#run-menu').hidden=true;return}const graphControl=e.target.closest('[data-graph]');if(graphControl){const cmd=graphControl.dataset.graph;if(cmd==='plus')graph.scale=Math.min(2,graph.scale*1.15);if(cmd==='minus')graph.scale=Math.max(.5,graph.scale/1.15);if(cmd==='fit'){graph.scale=1;graph.tx=graph.ty=0}if(cmd==='reset'){graph.nodes=initialNodes.map(x=>({...x}));graph.scale=1;graph.tx=graph.ty=0;drawGraph()}$('#graph-transform')?.setAttribute('transform',`translate(${graph.tx} ${graph.ty}) scale(${graph.scale})`);return}const filter=e.target.closest('[data-tool-filter]');if(filter){state.catalogFilter=filter.dataset.toolFilter;renderDocument();return}const context=e.target.closest('[data-context]');if(context){$('#object-menu').hidden=true;const cmd=context.dataset.context;if(cmd==='open')selectVariable(state.selected);if(cmd==='table')showDocument('table');if(cmd==='probe')addProbe();if(cmd==='source')actions.source();if(cmd==='graph')showDocument('graph');return}const help=e.target.closest('[data-help]');if(help){$('#help').textContent='显示参数只影响当前视图。正式版重绘使用已有证据，数据不足时再准备新运行。';$('#help').hidden=!$('#help').hidden;return}if(!e.target.closest('#run-menu'))$('#run-menu').hidden=true;if(!e.target.closest('#object-menu'))$('#object-menu').hidden=true;if(!e.target.closest('#help'))$('#help').hidden=true});
document.addEventListener('change',e=>{if(e.target.id==='comparison-version'){state.compare.version=Number(e.target.value);renderComparison()}if(e.target.matches('#run-select,#snapshot-select')){state.version=Number(e.target.value);renderAll()}if(e.target.matches('[data-probe-enable]')){const p=state.probes.find(p=>p.id===Number(e.target.dataset.probeEnable));p.enabled=e.target.checked;renderInspector();renderBottom()}if(e.target.id==='show-values'){displayOptions().values=e.target.checked;$('.matrix-wrap')?.classList.toggle('values-hidden',!e.target.checked)}if(e.target.id==='color-palette'){displayOptions().palette=e.target.value;renderDocument()}if(e.target.id==='color-min'||e.target.id==='color-max'){const min=Number($('#color-min').value),max=Number($('#color-max').value);if(Number.isFinite(min)&&Number.isFinite(max)&&min<max){Object.assign(displayOptions(),{min,max});renderDocument()}else notify('色标最小值应小于最大值')}});
document.addEventListener('input',e=>{if(e.target.id==='variable-search')renderVariables();if(e.target.id==='command-search')renderCommands();if(e.target.id==='tool-search')$('#catalog-rows').innerHTML=catalogRows(e.target.value)});
document.addEventListener('contextmenu',e=>{const variable=e.target.closest('[data-variable]');if(!variable)return;e.preventDefault();state.selected=variable.dataset.variable;renderVariables();renderSource();renderInspector();const menu=$('#object-menu');menu.hidden=false;menu.style.left=Math.min(e.clientX,innerWidth-190)+'px';menu.style.top=Math.min(e.clientY,innerHeight-185)+'px'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.focus)toggleFocus(false);$('#run-menu').hidden=true;$('#object-menu').hidden=true;$('#help').hidden=true;app.classList.remove('show-source');return}if((e.ctrlKey||e.metaKey)&&((e.shiftKey&&e.key.toLowerCase()==='p')||e.key.toLowerCase()==='k')){e.preventDefault();openCommand()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){e.preventDefault();actions.sidebar()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='j'){e.preventDefault();actions.bottom()}if(e.target.id==='command-search'&&e.key==='ArrowDown'){e.preventDefault();$('.command-item')?.focus()}if(e.target.matches('.command-item')&&e.key==='ArrowDown'){e.preventDefault();e.target.nextElementSibling?.focus()}if(e.target.matches('.command-item')&&e.key==='ArrowUp'){e.preventDefault();if(e.target.previousElementSibling)e.target.previousElementSibling.focus();else $('#command-search').focus()}});
function resizable(id,axis,valueSetter,getInitial){const handle=$('#'+id);handle.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();const initial=getInitial(),start=axis==='x'?e.clientX:e.clientY;handle.classList.add('dragging');handle.setPointerCapture(e.pointerId);const move=e=>valueSetter(initial,(axis==='x'?e.clientX:e.clientY)-start),finish=()=>{handle.classList.remove('dragging');handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',finish);handle.removeEventListener('pointercancel',finish)};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish)});handle.addEventListener('keydown',e=>{const delta=e.key==='ArrowRight'||e.key==='ArrowDown'?10:e.key==='ArrowLeft'||e.key==='ArrowUp'?-10:0;if(delta){e.preventDefault();valueSetter(getInitial(),delta)}})}
resizable('explorer-divider','x',(v,d)=>app.style.setProperty('--side',Math.max(170,Math.min(360,v+d))+'px'),()=>$('.explorer').getBoundingClientRect().width);
resizable('inspector-divider','x',(v,d)=>app.style.setProperty('--inspect',Math.max(220,Math.min(420,v-d))+'px'),()=>$('.inspector').getBoundingClientRect().width);
resizable('source-divider','x',(v,d)=>app.style.setProperty('--code',Math.max(210,Math.min($('.documents').getBoundingClientRect().width-270,v+d))+'px'),()=>$('.source-group').getBoundingClientRect().width);
resizable('probe-divider','x',(v,d)=>app.style.setProperty('--compare-width',Math.max(240,Math.min($('.documents').getBoundingClientRect().width-260,v-d))+'px'),()=>$('#comparison-group').getBoundingClientRect().width);
resizable('bottom-divider','y',(v,d)=>app.style.setProperty('--bottom',Math.max(85,Math.min(350,v-d))+'px'),()=>$('.bottom-panel').getBoundingClientRect().height);
renderAll();
const requested=new URLSearchParams(location.search).get('view');if(requested==='graph')showDocument('graph');if(requested==='tools')showDocument('tools');if(requested==='plan')actions['run-options']();
